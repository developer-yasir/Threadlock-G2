<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#080E1A"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Emerald Phosphor Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Metallic Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#384556"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Green Neon Gradient -->
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="50%" stop-color="#00FF41"/>
      <stop offset="100%" stop-color="#00D26A"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Center Radial Ambient Light -->
    <radialGradient id="centerGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base with Rounded Border -->
  <rect width="800" height="800" rx="160" fill="url(#bgGrad)"/>
  <rect width="796" height="796" x="2" y="2" rx="158" fill="none" stroke="#1E293B" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Ambient Backdrop Glow -->
  <circle cx="400" cy="340" r="320" fill="url(#centerGlow)"/>

  <!-- Background HUD Grid Elements -->
  <g opacity="0.15" stroke="#00FF41" stroke-width="1">
    <circle cx="400" cy="340" r="260" fill="none" stroke-dasharray="4 8"/>
    <circle cx="400" cy="340" r="200" fill="none" stroke-dasharray="2 6"/>
    <line x1="140" y1="340" x2="660" y2="340" stroke-dasharray="6 6"/>
    <line x1="400" y1="140" x2="400" y2="540" stroke-dasharray="6 6"/>
  </g>

  <!-- HUD Corner Brackets -->
  <g stroke="#00FF41" stroke-width="2.5" fill="none" opacity="0.4">
    <path d="M 210,180 L 180,180 L 180,210"/>
    <path d="M 590,180 L 620,180 L 620,210"/>
    <path d="M 210,500 L 180,500 L 180,470"/>
    <path d="M 590,500 L 620,500 L 620,470"/>
  </g>

  <!-- Optical Waveguide HUD Specs (Subtle) -->
  <g font-family="monospace" font-size="11" fill="#00FF41" opacity="0.4" letter-spacing="1.5">
    <text x="185" y="168">EVEN REALITIES G2 // 576x288</text>
    <text x="495" y="168">STATUS: LOCKED</text>
    <text x="185" y="522">DIFF: 0ms LATENCY</text>
    <text x="505" y="522">SHA-256 VERIFIED</text>
  </g>

  <!-- ================= MAIN EMBLEM ================= -->
  <g transform="translate(0, -20)">

    <!-- Lock Shackle (Anchoring the Glasses Bridge) -->
    <path d="M 345,260 L 345,220 C 345,175 455,175 455,220 L 455,260" 
          fill="none" 
          stroke="url(#neonGreenGrad)" 
          stroke-width="16" 
          stroke-linecap="round"
          filter="url(#neonGlow)"/>

    <!-- Inner Lock Shackle Highlight -->
    <path d="M 358,255 L 358,222 C 358,190 442,190 442,222 L 442,255" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="4" 
          stroke-linecap="round"
          opacity="0.8"/>

    <!-- Left Smart Glasses Optical Lens Frame -->
    <path d="M 340,310 
             L 240,305 
             C 170,305 150,335 155,385 
             C 160,435 200,455 270,450 
             L 330,445 
             C 345,443 355,420 355,390 
             Z" 
          fill="#06121E" 
          fill-opacity="0.75" 
          stroke="url(#frameGrad)" 
          stroke-width="8"/>

    <!-- Left Lens Glowing Reticle & HUD Display -->
    <path d="M 330,320 
             L 245,316 
             C 185,316 168,340 172,380 
             C 176,420 208,438 268,434 
             L 322,430 
             C 334,428 342,408 342,385 
             Z" 
          fill="none" 
          stroke="url(#neonGreenGrad)" 
          stroke-width="3" 
          filter="url(#subtleGlow)" 
          opacity="0.85"/>

    <!-- Left Lens HUD Data Elements -->
    <g transform="translate(195, 345)" font-family="monospace" fill="#00FF41" filter="url(#subtleGlow)">
      <text x="0" y="15" font-size="12" font-weight="bold">BASELINE: $10,000</text>
      <text x="0" y="32" font-size="10" opacity="0.8">TERMS IN SYNC</text>
      <rect x="0" y="42" width="90" height="3" fill="#00FF41" opacity="0.6"/>
      <circle cx="102" cy="22" r="3" fill="#00FF41"/>
    </g>

    <!-- Right Smart Glasses Optical Lens Frame -->
    <path d="M 460,310 
             L 560,305 
             C 630,305 650,335 645,385 
             C 640,435 600,455 530,450 
             L 470,445 
             C 455,443 445,420 445,390 
             Z" 
          fill="#06121E" 
          fill-opacity="0.75" 
          stroke="url(#frameGrad)" 
          stroke-width="8"/>

    <!-- Right Lens Glowing Reticle & HUD Display -->
    <path d="M 470,320 
             L 555,316 
             C 615,316 632,340 628,380 
             C 624,420 592,438 532,434 
             L 478,430 
             C 466,428 458,408 458,385 
             Z" 
          fill="none" 
          stroke="url(#neonGreenGrad)" 
          stroke-width="3" 
          filter="url(#subtleGlow)" 
          opacity="0.85"/>

    <!-- Right Lens HUD Data Elements -->
    <g transform="translate(480, 345)" font-family="monospace" fill="#00FF41" filter="url(#subtleGlow)">
      <text x="0" y="15" font-size="12" font-weight="bold">DRIFT: 0.00%</text>
      <text x="0" y="32" font-size="10" opacity="0.8">HUD GLANCE: READY</text>
      <rect x="0" y="42" width="90" height="3" fill="#00FF41" opacity="0.6"/>
      <circle cx="102" cy="22" r="3" fill="#00FF41"/>
    </g>

    <!-- Sleek Glasses Browline / Frame Top Bar Connecting Lenses -->
    <path d="M 140,310 
             C 210,295 320,290 400,290 
             C 480,290 590,295 660,310" 
          fill="none" 
          stroke="url(#frameGrad)" 
          stroke-width="12" 
          stroke-linecap="round"/>

    <!-- Titanium Temple Hinges (Left & Right) -->
    <circle cx="140" cy="310" r="7" fill="#64748B"/>
    <circle cx="660" cy="310" r="7" fill="#64748B"/>

    <!-- Center Security Padlock Body (The "ThreadLock Node") -->
    <rect x="340" y="275" width="120" height="150" rx="24" 
          fill="#0B1322" 
          stroke="url(#neonGreenGrad)" 
          stroke-width="6" 
          filter="url(#neonGlow)"/>

    <!-- Lock Body Core Plate -->
    <rect x="352" y="287" width="96" height="126" rx="16" 
          fill="#060A12" 
          stroke="#1E293B" 
          stroke-width="2"/>

    <!-- Glowing Cyber Keyhole / Circuit Node -->
    <circle cx="400" cy="335" r="16" fill="url(#neonGreenGrad)" filter="url(#neonGlow)"/>
    <polygon points="392,342 408,342 413,380 387,380" fill="url(#neonGreenGrad)" filter="url(#neonGlow)"/>
    <circle cx="400" cy="335" r="7" fill="#FFFFFF"/>

    <!-- Digital Thread Pulses Flowing Out of Lock -->
    <path d="M 340,350 L 290,350 L 270,370" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <circle cx="270" cy="370" r="3" fill="#38BDF8"/>

    <path d="M 460,350 L 510,350 L 530,370" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <circle cx="530" cy="370" r="3" fill="#38BDF8"/>

  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- Brand Name -->
  <g text-anchor="middle">
    <text x="355" y="660" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" 
          font-size="54" 
          font-weight="900" 
          letter-spacing="12" 
          fill="#FFFFFF">
      THREADLOCK
    </text>

    <!-- Glowing G2 Badge -->
    <text x="615" y="660" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" 
          font-size="58" 
          font-weight="900" 
          letter-spacing="4" 
          fill="url(#neonGreenGrad)" 
          filter="url(#neonGlow)">
      G2
    </text>

    <!-- Subtitle / Tagline -->
    <text x="400" y="705" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" 
          font-size="17" 
          font-weight="700" 
          letter-spacing="5" 
          fill="#64748B">
      HEADS-UP DEAL COMMITMENT HUD
    </text>

    <!-- Hardware Target Sub-badge -->
    <text x="400" y="735" 
          font-family="monospace" 
          font-size="12" 
          font-weight="600" 
          letter-spacing="3" 
          fill="#00FF41" 
          opacity="0.85">
      FOR EVEN REALITIES G2 SMART GLASSES
    </text>
  </g>
</svg>
